<style>
/* Apple-stijl (bento): iOS-grijze achtergrond, witte kaarten met grote afronding, systeemlettertype, iOS-systeemkleuren. Licht en donker. */
:root{

  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter Tight",system-ui,"Segoe UI",sans-serif;

  --f-mono:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter Tight",system-ui,sans-serif;
  --f-code:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --sunk:#2C2C2E; --fill:#2C2C2E; --ink:#FFFFFF; --muted:#98989F; --line:rgba(84,84,88,.55);
  --accent:#0A84FF; --accent-ink:#FFFFFF; --accent-soft:rgba(10,132,255,.22); --gold:#FFD60A;
  --b1:#0A84FF; --bx:#636366; --b2:#FF9F0A; --good:#30D158; --bad:#FF453A; --warn:#FF9F0A; --info:#0A84FF;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --sunk:#2C2C2E; --fill:#2C2C2E; --ink:#FFFFFF; --muted:#98989F; --line:rgba(84,84,88,.55);
  --accent:#0A84FF; --accent-ink:#FFFFFF; --accent-soft:rgba(10,132,255,.22); --gold:#FFD60A;
  --b1:#0A84FF; --bx:#636366; --b2:#FF9F0A; --good:#30D158; --bad:#FF453A; --warn:#FF9F0A; --info:#0A84FF;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
#app{max-width:1240px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.02em;text-wrap:balance;margin:0;font-weight:700}
h2{font-size:34px;line-height:1.1} h3{font-size:21px;margin:26px 0 10px;letter-spacing:-.015em} h4{font-size:16px;margin:0 0 6px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
.mono,.tbl td.mono{font-variant-numeric:tabular-nums}
code,pre{font-family:var(--f-code)}
.dim{color:var(--muted)} .warn{color:var(--warn)} small{color:var(--muted)}
/* kop */
header.top{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;padding:22px 0 10px}
.brand{display:flex;gap:14px;align-items:center}

.crumbs{margin:12px 0 14px;display:grid;gap:10px}
.crumbs>*,.brand,.brand>div,.topctl{min-width:0}

.toast button{background:none;border:0;color:inherit;font-size:20px;cursor:pointer;line-height:1}
details.notes{background:var(--surface);border-radius:var(--r-s);padding:12px 18px;margin:12px 0;box-shadow:var(--shadow)}
details.notes summary{cursor:pointer;font-weight:600}
details.notes ul{margin:6px 0;padding-left:18px}

.tbl{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}

.tbl .l{text-align:left} .tbl tr:last-child td{border-bottom:0}
.tbl td.pos{color:var(--muted);width:2.4em;border-left:4px solid transparent}
.tbl td.pts{font-weight:700}
.tbl.compact td,.tbl.compact th{padding:8px 8px}
tr.z-champ td.pos{border-left-color:var(--z-champ)} tr.z-cl td.pos{border-left-color:var(--z-cl)} tr.z-clq td.pos{border-left-color:var(--z-clq)} tr.z-el td.pos{border-left-color:var(--z-el)} tr.z-ecl td.pos{border-left-color:var(--z-ecl)} tr.z-eurpo td.pos{border-left-color:var(--z-eurpo)} tr.z-promo td.pos{border-left-color:var(--z-promo)} tr.z-po td.pos{border-left-color:var(--z-po)} tr.z-relpo td.pos{border-left-color:var(--z-relpo)} tr.z-rel td.pos{border-left-color:var(--z-rel)}

.sw{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.sw.z-champ{background:var(--z-champ)} .sw.z-cl{background:var(--z-cl)} .sw.z-clq{background:var(--z-clq)} .sw.z-el{background:var(--z-el)} .sw.z-ecl{background:var(--z-ecl)} .sw.z-eurpo{background:var(--z-eurpo)} .sw.z-promo{background:var(--z-promo)} .sw.z-po{background:var(--z-po)} .sw.z-relpo{background:var(--z-relpo)} .sw.z-rel{background:var(--z-rel)}
th.z-champh{box-shadow:inset 0 -3px var(--z-champ)} th.z-clh{box-shadow:inset 0 -3px var(--z-cl)} th.z-clqh{box-shadow:inset 0 -3px var(--z-clq)} th.z-elh{box-shadow:inset 0 -3px var(--z-el)} th.z-eclh{box-shadow:inset 0 -3px var(--z-ecl)} th.z-eurpoh{box-shadow:inset 0 -3px var(--z-eurpo)} th.z-promoh{box-shadow:inset 0 -3px var(--z-promo)} th.z-poh{box-shadow:inset 0 -3px var(--z-po)} th.z-relpoh{box-shadow:inset 0 -3px var(--z-relpo)} th.z-relh{box-shadow:inset 0 -3px var(--z-rel)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:8px 0 12px}

.fc{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:11px;font-weight:700;font-style:normal;margin-right:2px;color:#fff}
.fW{background:var(--good)} .fG{background:var(--bx)} .fV{background:var(--bad)}

.b1{background:var(--b1)} .bx{background:var(--bx)} .b2{background:var(--b2)}

.pb{position:relative;height:20px;background:var(--fill);border-radius:7px;overflow:hidden;min-width:90px}
.pb .pf{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.55}

.pb em{position:relative;font-size:11px;line-height:20px;font-weight:600;font-style:normal;padding-left:7px}
/* knoppen en invoer */
.btn{border:0;background:var(--fill);padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)} .btn.ghost{background:transparent} .btn.sm{padding:5px 10px;font-size:13px;border-radius:10px}

.lnk.sm{font-size:13px}
.row{display:flex;gap:12px;align-items:flex-end;margin:12px 0} .row.wrap{flex-wrap:wrap}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.chk{display:flex;align-items:center;gap:8px;color:var(--ink)}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
input,select,textarea{border:0;background:var(--fill);border-radius:10px;padding:9px 12px;color:var(--ink);font-size:15px;max-width:100%}
input[type=checkbox],input[type=range]{background:none}
input[type=number]{width:6.5em} input[type=range]{padding:0;width:130px;accent-color:var(--accent);vertical-align:middle}
textarea.code,pre.code{width:100%;font:12px/1.45 var(--f-code);background:var(--fill);border:0;border-radius:14px;padding:12px;overflow:auto;white-space:pre}
pre.code{margin:6px 0}
.pair{display:flex;gap:4px;align-items:center} .pair input{width:4.5em}
.simbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.prog{flex:1 1 180px;max-width:320px;height:8px;background:var(--fill);border-radius:999px;overflow:hidden}

.tbl td.mono.pos{color:var(--good)} .tbl td.mono.neg{color:var(--bad)}
