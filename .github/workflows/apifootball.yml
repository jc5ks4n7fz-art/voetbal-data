name: API-Football ophalen

on:
  schedule:
    - cron: "17 4 * * *"   # elke dag rond 05:17/06:17 Nederlandse tijd
  workflow_dispatch:         # handmatig starten via het tabblad Actions

permissions:
  contents: write

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Data ophalen
        run: python apifootball_ophalen.py
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      - name: Opslaan in de repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/apifootball.json
          git diff --cached --quiet || git commit -m "API-Football data bijgewerkt"
          git push
