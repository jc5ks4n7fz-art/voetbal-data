name: API-Football ophalen

on:
  schedule:
    - cron: "17 4 * * *"   # elke dag rond 05:17/06:17 Nederlandse tijd
  workflow_dispatch:         # handmatig starten via het tabblad Actions

permissions:
  contents: write

jobs:
  ophalen:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Data ophalen
        id: ophalen
        continue-on-error: true   # status.json wordt hoe dan ook opgeslagen
        run: python apifootball_ophalen.py
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      - name: Opslaan in de repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "API-Football data bijgewerkt"
          git pull --rebase origin main
          git push
      - name: Melding bij fout
        if: steps.ophalen.outcome == 'failure'
        run: |
          echo "Ophalen mislukt; zie data/status.json"
          cat data/status.json || true
          exit 1
